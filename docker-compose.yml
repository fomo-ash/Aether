version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: aether
    ports:
      - "5450:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6850:6379"

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    ports:
      - "3250:3250"
    environment:
      - DATABASE_URL=postgresql://user:password@postgres:5432/aether?schema=public
      - REDIS_URL=redis://redis:6379
      - PORT=3250
    depends_on:
      - postgres
      - redis

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    environment:
      - DATABASE_URL=postgresql://user:password@postgres:5432/aether?schema=public
      - REDIS_URL=redis://redis:6379
      - GITHUB_APP_ID=${GITHUB_APP_ID:-}
      - GITHUB_PRIVATE_KEY=${GITHUB_PRIVATE_KEY:-}
      - FEATHERLESS_API_KEY=${FEATHERLESS_API_KEY:-}
      - CASPIAN_API_KEY=${CASPIAN_API_KEY:-}
    depends_on:
      - postgres
      - redis

  caspian:
    build:
      context: .
      dockerfile: services/caspian/Dockerfile
    environment:
      - DATABASE_URL=postgresql://user:password@postgres:5432/aether?schema=public
      - REDIS_URL=redis://redis:6379
      - AETHER_API_URL=http://api:3250
      - CASPIAN_API_KEY=${CASPIAN_API_KEY:-}
    depends_on:
      - postgres
      - redis
      - api

  redisinsight:
    image: redis/redisinsight:latest
    ports:
      - "5540:5540"
    depends_on:
      - redis

volumes:
  pgdata:
